name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool libtool-bin libltdl-dev \
            pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache m4 texinfo gettext liblzma-dev uuid-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "cython<3" buildozer

      - name: Cache buildozer global dir
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-p4apatch-${{ hashFiles('buildozer.spec') }}

      - name: Cache buildozer project dir
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-project-p4apatch-${{ hashFiles('buildozer.spec') }}

      - name: Pre-clone and patch python-for-android
        run: |
          mkdir -p .buildozer/android/platform
          if [ ! -d .buildozer/android/platform/python-for-android ]; then
            git clone --depth 1 --branch v2024.01.21 \
              https://github.com/kivy/python-for-android.git \
              .buildozer/android/platform/python-for-android
          fi
          # Patch python3 recipe: inject -Wno-error=implicit-function-declaration
          # to work around bionic libc missing setgrent/getgrent/endgrent
          RECIPE=.buildozer/android/platform/python-for-android/pythonforandroid/recipes/python3/__init__.py
          python3 - <<'PYEOF'
          import re
          path = ".buildozer/android/platform/python-for-android/pythonforandroid/recipes/python3/__init__.py"
          with open(path, "r") as f:
              src = f.read()
          marker = "def get_recipe_env(self, arch=None, with_flags_in_cc=True):"
          inject = (
              "        env['CFLAGS'] = env.get('CFLAGS', '') + "
              "' -Wno-error=implicit-function-declaration'\n"
              "        env['CPPFLAGS'] = env.get('CPPFLAGS', '') + "
              "' -Wno-error=implicit-function-declaration'\n"
              "        return env\n"
          )
          # Replace the final return env in get_recipe_env
          pattern = r"(def get_recipe_env\(self, arch=None, with_flags_in_cc=True\):.*?)(        return env\n)"
          new_src, n = re.subn(pattern, lambda m: m.group(1) + inject, src, count=1, flags=re.DOTALL)
          if n == 0:
              print("WARNING: patch marker not found, trying alternate")
              new_src = src.replace("        return env\n", inject, 1)
          with open(path, "w") as f:
              f.write(new_src)
          print("Patched python3 recipe")
          PYEOF
          grep -n "implicit-function-declaration" .buildozer/android/platform/python-for-android/pythonforandroid/recipes/python3/__init__.py || echo "patch verification failed"

      - name: Build APK (debug)
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AstroSurvivor-APK
          path: bin/*.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
