name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool libtool-bin libltdl-dev \
            pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache m4 texinfo gettext liblzma-dev uuid-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "cython<3" buildozer

      - name: Cache buildozer global dir
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-ndkapi26-${{ hashFiles('buildozer.spec') }}

      - name: Cache buildozer project dir
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-project-ndkapi26-${{ hashFiles('buildozer.spec') }}

      - name: Pre-clone p4a and inject disabled module patch
        run: |
          mkdir -p .buildozer/android/platform
          if [ ! -d .buildozer/android/platform/python-for-android ]; then
            git clone --depth 1 --branch v2024.01.21 \
              https://github.com/kivy/python-for-android.git \
              .buildozer/android/platform/python-for-android
          fi
          # Inject a monkey-patch into python3 recipe so that after extraction
          # of the Python source, we disable _lzma and _uuid optional modules
          # (NDK sysroot has neither lzma.h nor libuuid; we don't need them).
          cat >> .buildozer/android/platform/python-for-android/pythonforandroid/recipes/python3/__init__.py <<'PYEOF'

# ----- Local patch: disable _lzma / _uuid optional modules -----
import os as _os
_orig_prebuild_arch = Python3Recipe.prebuild_arch

def _patched_prebuild_arch(self, arch):
    _orig_prebuild_arch(self, arch)
    src = self.get_build_dir(arch.arch)
    setup_local = _os.path.join(src, 'Modules', 'Setup.local')
    with open(setup_local, 'a') as _f:
        _f.write('\n*disabled*\n_lzma\n_uuid\n')
    print('[astrosurvivor] disabled _lzma and _uuid modules via Setup.local')

Python3Recipe.prebuild_arch = _patched_prebuild_arch
PYEOF
          echo "Patched p4a python3 recipe:"
          tail -20 .buildozer/android/platform/python-for-android/pythonforandroid/recipes/python3/__init__.py

      - name: Build APK (debug)
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AstroSurvivor-APK
          path: bin/*.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
